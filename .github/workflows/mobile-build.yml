name: Mobile Build

# Retired 2026-09-21 (`u13-ux-a11y-mobile`).
#
# The Capacitor shell under `mobile/` was removed because the
# project ships a single Rust binary and there is no
# receipt-capture flow to justify the parallel native build.
# Mobile users get the installable PWA from the binary itself;
# see `mobile/README.md` and `docs/wcag-audit-2026-09-21.md`
# finding A11.
#
# This file is kept so the disabled-job history remains
# reviewable; jobs are explicitly no-ops that echo the
# retirement notice.

on:
  push:
    tags:
      - 'v*'

jobs:
  retired:
    name: Retired
    runs-on: ubuntu-latest
    steps:
      - name: Notice
        run: |
          echo "Mobile Build workflow is retired (2026-09-21, u13-ux-a11y-mobile)."
          echo "Mobile users install the PWA shipped from the binary; see mobile/README.md."