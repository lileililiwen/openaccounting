[package]
name = "openaccounting"
version = "0.1.0"
edition = "2021"
description = "Open-source double-entry bookkeeping for individuals and startups"
license = "MIT"

[lib]
name = "openaccounting"
path = "src/lib.rs"

[[bin]]
name = "openaccounting"
path = "src/main.rs"

[features]
# Test-only module `test_support` (TestDb, TestServer). Not included
# in production builds. The integration test in `tests/integration`
# enables this feature via `required-features` below.
default = []
test-support = ["dep:postgres"]
storage-s3 = [
    "dep:aws-sdk-s3",
    "dep:aws-config",
    "dep:aws-credential-types",
]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Fast profile used inside Docker builds — same binary size after strip,
# but ~5-10× faster build because of parallel codegen and thin LTO.
[profile.release-fast]
inherits = "release"
codegen-units = 256
lto = "thin"

[dependencies]
axum = { version = "0.8.1", features = ["multipart"] }
tokio = { version = "1.43.0", features = ["full"] }
tower = "0.5.2"
tower-http = { version = "0.6.2", features = ["trace", "fs", "limit"] }
hyper = "1.6.0"
http = "1.3.1"

sqlx = { version = "0.8.3", features = [
    "postgres",
    "runtime-tokio",
    "tls-rustls",
    "macros",
    "uuid",
    "chrono",
    "migrate",
    "rust_decimal",
] }

serde = { version = "1.0.218", features = ["derive"] }
serde_json = "1.0.140"
chrono = { version = "0.4.40", features = ["serde"] }
uuid = { version = "1.15.1", features = ["serde", "v4", "v5"] }
rust_decimal = { version = "1.36.0", features = ["serde-with-str"] }
rust_decimal_macros = "1.37.1"

# Auth: argon2 password hashing, sqlx-backed sessions (PostgreSQL store)
argon2 = "0.5.3"
async-trait = "0.1.87"
axum-login = "0.17.0"
tower-sessions = "0.14.0"
tower-sessions-sqlx-store = { version = "0.15.0", features = ["postgres"] }
time = "0.3.39"

# Templates: type-safe, pure-Rust, Jinja-like
askama = "0.13.0"

# Misc
dotenvy = "0.15.7"
clap = { version = "4", features = ["derive"] }
csv = "1.3.1"
subtle = "2"
tracing = "0.1.40"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
log = "0.4.27"
thiserror = "1.0.69"
anyhow = "1.0.91"
once_cell = "1.20.2"
regex = "1.11.0"
sanitize-filename = "0.5.0"
mime = "0.3.17"
futures = "0.3.31"
form_urlencoded = "1.2.0"
flate2 = "1.1.1"
hex = "0.4"

# Platform-specific bill importers (WeChat / Alipay)
encoding_rs = "0.8"
xxhash-rust = { version = "0.8", features = ["xxh3"] }

# Bank feeds: AES-256-GCM encryption of provider tokens + HTTP provider clients.
aes-gcm = "0.10"
base64 = "0.22"
reqwest = { version = "0.12", default-features = false,
            features = ["json", "rustls-tls", "cookies", "multipart"] }

# Receipt OCR: tesseract-plumbing provides safe Rust bindings to libtesseract.
# Our TesseractEngine shells out via tokio::process::Command instead of the
# FFI bindings so that the binary doesn't require libtesseract at link time.
# The crate is kept as an optional dependency for future native integration.
tesseract-plumbing = { version = "0.11", optional = true }

# Optional dependencies used by the test-support module.
# The `test-support` feature above flips these on. They are
# absent from the production binary.
postgres = { version = "0.19", optional = true, default-features = false }

# Optional S3 backend for the storage layer (`o6-s3-storage`).
# Not compiled into the default binary; opt in with
# `--features storage-s3`. The `aws-sdk-s3` and `aws-config`
# crates pull in a lot of code, so this stays gated.
aws-sdk-s3 = { version = "1.55", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-config = { version = "1.5", optional = true, default-features = false, features = ["behavior-version-latest", "rustls", "rt-tokio"] }
aws-credential-types = { version = "1.2", optional = true }

# Tempfile is used both by the scheduled-backup worker
# (`o2-scheduled-backups`) and by the test-support module.
tempfile = "3"
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
qrcodegen = "1.8"
hkdf = "0.12"
rand = "0.8"
sha2 = "0.10"
hmac = "0.13.0"
metrics = "0.24.6"
metrics-exporter-prometheus = "0.18.3"
infer = "0.16"
cron = "0.12"

[dev-dependencies]
# reqwest is already a non-optional dep; re-declare for dev to get the
# same features (cookie_store is needed for the test client).
reqwest = { version = "0.12", default-features = false,
            features = ["json", "rustls-tls", "cookies", "multipart"] }
# Sandboxes for the per-test DOCUMENTS_DIR.
tempfile = "3"
# Sync Postgres client used in TestDb::Drop to drop the test DB
# after the tokio runtime has already shut down.
postgres = { version = "0.19", default-features = false }

[[test]]
name = "integration"
path = "tests/integration/main.rs"
required-features = ["test-support"]
