{% extends "base.html" %}
{% block title %}New ledger — OpenAccounting{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-md w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <h1 class="text-2xl font-semibold mb-4">New ledger</h1>
  {% if !error.is_empty() %}
    <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/ledgers/new" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Name</span>
      <input name="name" required placeholder="Personal, Acme Inc., Side Project…" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Base currency (3-letter code)</span>
      <input name="base_currency" required value="USD" maxlength="3" minlength="3" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm uppercase" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Timezone (optional)</span>
      <input name="timezone" placeholder="UTC" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <p class="text-xs text-slate-500">A default chart of accounts will be created for you. You can edit it later.</p>
    <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Create ledger</button>
  </form>
</main>
{% endblock %}
