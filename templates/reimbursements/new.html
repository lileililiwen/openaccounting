{% extends "base.html" %}
{% block title %}New Claim — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <h1 class="text-2xl font-semibold">New Reimbursement Claim</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/reimbursements" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Title</span>
      <input name="title" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Employee name</span>
      <input name="employee_name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Currency (3-letter code)</span>
      <input name="currency" required value="USD" maxlength="3" minlength="3" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm uppercase" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Description (optional)</span>
      <textarea name="description" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
    </label>
    <button class="rounded-lg bg-slate-900 text-white text-sm px-4 py-2 hover:bg-slate-800">Create Draft</button>
  </form>
</main>
{% endblock %}
