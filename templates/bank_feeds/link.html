{% extends "base.html" %}
{% block title %}Link Bank Account — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-lg w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-6">
  <header>
    <h1 class="text-2xl font-semibold">Link Bank Account</h1>
    <p class="text-slate-500 text-sm">Connect a bank account to sync transactions automatically.</p>
  </header>

  <form method="post" action="/ledgers/{{ ledger_id }}/bank-feeds/link"
        class="bg-white border border-slate-200 rounded-xl p-6 space-y-4">

    <label class="block text-sm">
      <span class="text-slate-600 font-medium">Provider</span>
      <select name="provider" required class="mt-1 block w-full rounded border border-slate-300 px-2 py-1.5 text-sm">
        <option value="manual">Manual (no external API)</option>
        <option value="plaid">Plaid (US/CA)</option>
        <option value="gocardless">GoCardless (EU/UK)</option>
        <option value="salt_edge">Salt Edge (global)</option>
        <option value="simplefin">SimpleFIN (US, free)</option>
      </select>
    </label>

    <label class="block text-sm">
      <span class="text-slate-600 font-medium">Token / Setup token</span>
      <input name="public_token" required placeholder="Paste your provider token here"
             class="mt-1 block w-full rounded border border-slate-300 px-2 py-1.5 text-sm font-mono" />
      <p class="text-xs text-slate-400 mt-1">
        For Plaid: use the Plaid Link widget public_token.<br/>
        For SimpleFIN: paste the base64 setup token from simplefin.org.<br/>
        For GoCardless / Salt Edge: paste the connection/requisition ID.
      </p>
    </label>

    <label class="block text-sm">
      <span class="text-slate-600 font-medium">Institution name (optional)</span>
      <input name="institution_id" placeholder="e.g. Chase, Barclays"
             class="mt-1 block w-full rounded border border-slate-300 px-2 py-1.5 text-sm" />
    </label>

    <label class="block text-sm">
      <span class="text-slate-600 font-medium">Post transactions to account</span>
      <select name="account_id_in_ledger" class="mt-1 block w-full rounded border border-slate-300 px-2 py-1.5 text-sm">
        <option value="">— don't post (import only) —</option>
        {% for (id, name) in accounts %}
          <option value="{{ id }}">{{ name }}</option>
        {% endfor %}
      </select>
    </label>

    <div class="flex gap-3 pt-2">
      <button type="submit"
              class="rounded-xl bg-slate-900 text-white px-4 py-2 text-sm font-semibold hover:bg-slate-700">
        Link Account
      </button>
      <a href="/ledgers/{{ ledger_id }}/bank-feeds"
         class="rounded-xl border border-slate-300 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">
        Cancel
      </a>
    </div>
  </form>
</main>
{% endblock %}
