{% extends "base.html" %}
{% block title %}New Fixed Asset — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <a href="/ledgers/{{ ledger_id }}/fixed-assets" class="text-sm text-slate-500 hover:text-slate-800">← Back</a>
    <h1 class="text-2xl font-semibold mt-1">New Fixed Asset</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/fixed-assets" class="rounded-xl bg-white border border-slate-200 p-4 space-y-3">
    <div>
      <label class="text-sm font-medium text-slate-700">Name *</label>
      <input name="name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Description</label>
      <textarea name="description" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Asset Account *</label>
      <select name="account_id" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">Select asset account...</option>
        {% for (a_id, code, name) in accounts %}
          <option value="{{ a_id }}">{{ code }} {{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Purchase Date *</label>
        <input name="purchase_date" type="date" value="{{ purchase_date }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Purchase Cost *</label>
        <input name="purchase_cost" type="number" step="0.01" value="{{ purchase_cost }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Salvage Value</label>
        <input name="salvage_value" type="number" step="0.01" value="0" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Useful Life (years) *</label>
        <input name="useful_life_years" type="number" min="1" value="5" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Method</label>
        <select name="depreciation_method" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="straight_line" {% if depreciation_method == "straight_line" %}selected{% endif %}>Straight line</option>
          <option value="declining_balance" {% if depreciation_method == "declining_balance" %}selected{% endif %}>Declining balance</option>
        </select>
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="/ledgers/{{ ledger_id }}/fixed-assets" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">Create Asset</button>
    </div>
  </form>
</main>
{% endblock %}
