{% extends "base.html" %}
{% block title %}New account — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-md w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <h1 class="text-2xl font-semibold mb-4">New account</h1>
  <p class="text-sm text-slate-500 mb-4">In <strong>{{ ledger_name }}</strong></p>
  {% if !error.is_empty() %}
    <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/ledgers/{{ ledger_id }}/accounts/new" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Name</span>
      <input name="name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Code (optional)</span>
      <input name="code" placeholder="e.g. 1010" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Type</span>
      <select name="account_type" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        {% for t in account_types %}
          <option value="{{ t.as_str() }}">{{ t.display_label() }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Subtype</span>
      <select name="account_subtype" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" id="account_subtype">
        <option value="CURRENT_ASSET">Current Asset</option>
      </select>
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Description (optional)</span>
      <textarea name="description" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
    </label>
    <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Create account</button>
  </form>

  <script>
    const subtypeOptions = {
      'ASSET': [
        { value: 'CURRENT_ASSET', label: 'Current Asset' },
        { value: 'FIXED_ASSET', label: 'Fixed Asset' },
        { value: 'INTANGIBLE_ASSET', label: 'Intangible Asset' },
        { value: 'OTHER_ASSET', label: 'Other Asset' }
      ],
      'LIABILITY': [
        { value: 'CURRENT_LIABILITY', label: 'Current Liability' },
        { value: 'LONG_TERM_LIABILITY', label: 'Long-Term Liability' }
      ],
      'EQUITY': [
        { value: 'EQUITY', label: 'Equity' },
        { value: 'RETAINED_EARNINGS', label: 'Retained Earnings' },
        { value: 'DRAWING', label: 'Drawing' }
      ],
      'INCOME': [
        { value: 'OPERATING_INCOME', label: 'Operating Income' },
        { value: 'NON_OPERATING_INCOME', label: 'Non-Operating Income' }
      ],
      'EXPENSE': [
        { value: 'COST_OF_GOODS_SOLD', label: 'Cost of Goods Sold' },
        { value: 'OPERATING_EXPENSE', label: 'Operating Expense' },
        { value: 'NON_OPERATING_EXPENSE', label: 'Non-Operating Expense' },
        { value: 'TAX_EXPENSE', label: 'Tax Expense' }
      ]
    };

    const typeSelect = document.querySelector('select[name="account_type"]');
    const subtypeSelect = document.getElementById('account_subtype');

    function updateSubtypes() {
      const selectedType = typeSelect.value;
      const options = subtypeOptions[selectedType] || [];
      subtypeSelect.innerHTML = options.map(o => `<option value="${o.value}">${o.label}</option>`).join('');
    }

    typeSelect.addEventListener('change', updateSubtypes);
    updateSubtypes();
  </script>
</main>
{% endblock %}
