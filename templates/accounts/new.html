{% extends "base.html" %}
{% block title %}New account — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-md w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <h1 class="text-2xl font-semibold mb-4">New account</h1>
  <p class="text-sm text-slate-500 mb-4">In <strong>{{ ledger_name }}</strong></p>
  {% if !error.is_empty() %}
    <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/ledgers/{{ ledger_id }}/accounts/new" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Name</span>
      <input name="name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Code (optional)</span>
      <input name="code" placeholder="e.g. 1010" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Type</span>
      <select name="account_type" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        {% for t in account_types %}
          <option value="{{ t.as_str() }}">{{ t.display_label() }}</option>
        {% endfor %}
      </select>
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Description (optional)</span>
      <textarea name="description" rows="2" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm"></textarea>
    </label>
    <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Create account</button>
  </form>
</main>
{% endblock %}
