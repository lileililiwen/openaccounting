{% extends "base.html" %}
{% block title %}New Tax Rate — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <a href="/ledgers/{{ ledger_id }}/taxes" class="text-sm text-slate-500 hover:text-slate-800">← Back</a>
    <h1 class="text-2xl font-semibold mt-1">New Tax Rate</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/taxes" class="rounded-xl bg-white border border-slate-200 p-4 space-y-3">
    <div>
      <label class="text-sm font-medium text-slate-700">Name *</label>
      <input name="name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Rate (e.g., 0.0825 for 8.25%)</label>
        <input name="rate" type="number" step="0.0001" min="0" max="1" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Type</label>
        <select name="kind" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="sales_tax" {% if kind == "sales_tax" %}selected{% endif %}>Sales Tax (collected)</option>
          <option value="purchase_tax" {% if kind == "purchase_tax" %}selected{% endif %}>Purchase Tax (paid)</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Tax Account *</label>
      <select name="account_id" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">Select liability / asset account...</option>
        {% for (a_id, code, name) in accounts %}
          <option value="{{ a_id }}" {% if account_id == a_id.to_string() %}selected{% endif %}>{{ code }} {{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="/ledgers/{{ ledger_id }}/taxes" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">Create Tax Rate</button>
    </div>
  </form>
</main>
{% endblock %}
