{% extends "base.html" %}
{% block title %}New invoice — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <header>
    <a href="/ledgers/{{ ledger_id }}/invoices" class="text-sm text-slate-500 hover:text-slate-800">← Back to invoices</a>
    <h1 class="text-2xl font-semibold mt-1">New invoice</h1>
    <p class="text-sm text-slate-500">In <strong>{{ ledger_name }}</strong></p>
  </header>

  {% if !error.is_empty() %}
    <div class="mt-3 mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/invoices/new" id="invoice-form" class="mt-3 space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Contact</span>
        <select name="contact_id" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          {% for c in contacts %}
            <option value="{{ c.id }}">{{ c.name }}</option>
          {% endfor %}
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Type</span>
        <select name="kind" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="receivable">Accounts Receivable (customer owes you)</option>
          <option value="payable">Accounts Payable (you owe vendor)</option>
        </select>
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Invoice Number (optional)</span>
        <input name="invoice_number" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Invoice Date</span>
        <input name="invoice_date" type="date" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Due Date</span>
        <input name="due_date" type="date" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </label>
    </div>

    <div>
      <div class="flex items-center justify-between mb-1">
        <span class="text-sm font-medium text-slate-700">Line items</span>
        <button type="button" id="add-line" class="text-sm rounded-lg border border-slate-300 px-2 py-1 hover:bg-slate-50">+ Add line</button>
      </div>
      <div class="space-y-2" id="lines">
        <div class="invoice-line grid grid-cols-12 gap-2 items-center">
          <input name="lines[0][description]" placeholder="Description (e.g. Consulting)" required class="col-span-5 rounded-lg border border-slate-300 px-2 py-1.5 text-sm" />
          <input name="lines[0][quantity]" type="number" step="0.01" min="0.01" placeholder="Qty" required class="col-span-2 rounded-lg border border-slate-300 px-2 py-1.5 text-sm tabular text-right" />
          <input name="lines[0][unit_price]" type="number" step="0.01" min="0.01" placeholder="Unit price" required class="col-span-3 rounded-lg border border-slate-300 px-2 py-1.5 text-sm tabular text-right" />
          <div class="col-span-2 flex items-center justify-end">
            <span class="line-amount text-sm tabular text-slate-700">—</span>
            <button type="button" class="remove-line ml-2 text-rose-500 hover:text-rose-700 text-sm" title="Remove line">&times;</button>
          </div>
        </div>
      </div>
      <div class="flex justify-end gap-4 mt-2 text-sm">
        <span class="text-slate-500">Total:</span>
        <span id="invoice-total" class="font-semibold tabular text-slate-800">0.00</span>
      </div>
    </div>

    <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Create invoice</button>
  </form>
</main>
<script>
(function () {
  var container = document.getElementById('lines');
  var addBtn = document.getElementById('add-line');
  var totalEl = document.getElementById('invoice-total');
  var idx = 1;

  function rewriteIndices(line, i) {
    line.querySelectorAll('input').forEach(function (el) {
      var name = el.getAttribute('name');
      if (name) el.setAttribute('name', name.replace(/lines\[\d+\]/, 'lines[' + i + ']'));
    });
  }

  function addLine() {
    var first = container.querySelector('.invoice-line');
    var clone = first.cloneNode(true);
    rewriteIndices(clone, idx);
    clone.querySelectorAll('input').forEach(function (el) { el.value = ''; });
    clone.querySelector('.line-amount').textContent = '—';
    idx++;
    container.appendChild(clone);
  }

  function recalc() {
    var total = 0;
    container.querySelectorAll('.invoice-line').forEach(function (line) {
      var qty = parseFloat(line.querySelector('input[name$="[quantity]"]').value) || 0;
      var price = parseFloat(line.querySelector('input[name$="[unit_price]"]').value) || 0;
      var amt = qty * price;
      line.querySelector('.line-amount').textContent = amt ? amt.toFixed(2) : '—';
      total += amt;
    });
    totalEl.textContent = total.toFixed(2);
  }

  container.addEventListener('input', recalc);
  container.addEventListener('click', function (ev) {
    var btn = ev.target.closest('.remove-line');
    if (!btn) return;
    if (container.querySelectorAll('.invoice-line').length <= 1) return;
    btn.closest('.invoice-line').remove();
    recalc();
  });
  if (addBtn) addBtn.addEventListener('click', addLine);
})();
</script>
{% endblock %}
