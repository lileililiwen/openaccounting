{% extends "base.html" %}
{% block title %}New Entity — OpenAccounting{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <a href="/entities" class="text-sm text-slate-500 hover:text-slate-800">← Back</a>
    <h1 class="text-2xl font-semibold mt-1">New Entity</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/entities" class="rounded-xl bg-white border border-slate-200 p-4 space-y-3">
    <div>
      <label class="text-sm font-medium text-slate-700">Name *</label>
      <input name="name" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="e.g. Acme Holdings" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Legal Name</label>
      <input name="legal_name" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="e.g. Acme Holdings LLC" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Tax ID</label>
      <input name="tax_id" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" placeholder="e.g. 12-3456789" />
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="/entities" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">Create Entity</button>
    </div>
  </form>
</main>
{% endblock %}
