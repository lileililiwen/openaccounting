{% extends "base.html" %}
{% block title %}New Payment — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <a href="/ledgers/{{ ledger_id }}/payments" class="text-sm text-slate-500 hover:text-slate-800">← Back</a>
    <h1 class="text-2xl font-semibold mt-1">New Payment</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/payments" class="rounded-xl bg-white border border-slate-200 p-4 space-y-3">
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Type</label>
        <select name="kind" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="received" {% if kind == "received" %}selected{% endif %}>Received (customer payment)</option>
          <option value="made" {% if kind == "made" %}selected{% endif %}>Made (vendor payment)</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Amount *</label>
        <input name="amount" type="number" step="0.01" value="{{ amount }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Payment Date *</label>
        <input name="payment_date" type="date" value="{{ payment_date }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Payment Method</label>
        <select name="payment_method" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="bank_transfer" {% if payment_method == "bank_transfer" %}selected{% endif %}>Bank transfer</option>
          <option value="cash" {% if payment_method == "cash" %}selected{% endif %}>Cash</option>
          <option value="check" {% if payment_method == "check" %}selected{% endif %}>Check</option>
          <option value="credit_card" {% if payment_method == "credit_card" %}selected{% endif %}>Credit card</option>
          <option value="other" {% if payment_method == "other" %}selected{% endif %}>Other</option>
        </select>
      </div>
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Reference</label>
      <input name="reference" value="{{ reference }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Contact</label>
      <select name="contact_id" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">—</option>
        {% for (c_id, name) in contacts %}
          <option value="{{ c_id }}" {% if contact_id == c_id.to_string() %}selected{% endif %}>{{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="text-sm font-medium text-slate-700">Apply to Invoice</label>
      <select name="invoice_id" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">— Leave unapplied —</option>
        {% for (i_id, number, total) in invoices %}
          <option value="{{ i_id }}" {% if invoice_id == i_id.to_string() %}selected{% endif %}>{{ number }} — {{ total }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="flex justify-end gap-2 pt-2">
      <a href="/ledgers/{{ ledger_id }}/payments" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">Record Payment</button>
    </div>
  </form>
</main>
{% endblock %}
