{% extends "base.html" %}
{% block title %}New Budget — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-2xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 space-y-4">
  <header>
    <a href="/ledgers/{{ ledger_id }}/budgets" class="text-sm text-slate-500 hover:text-slate-800">← Back</a>
    <h1 class="text-2xl font-semibold mt-1">New Budget</h1>
  </header>

  {% if !error.is_empty() %}
    <div class="rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}

  <form method="post" action="/ledgers/{{ ledger_id }}/budgets" class="rounded-xl bg-white border border-slate-200 p-4 space-y-3">
    <div>
      <label class="text-sm font-medium text-slate-700">Account *</label>
      <select name="account_id" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="">Select account...</option>
        {% for (a_id, code, name) in accounts %}
          <option value="{{ a_id }}">{{ code }} {{ name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Period</label>
        <select name="period" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
          <option value="monthly" {% if period == "monthly" %}selected{% endif %}>Monthly</option>
          <option value="quarterly" {% if period == "quarterly" %}selected{% endif %}>Quarterly</option>
          <option value="yearly" {% if period == "yearly" %}selected{% endif %}>Yearly</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Amount *</label>
        <input name="amount" type="number" step="0.01" value="{{ amount }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
    </div>
    <div class="grid grid-cols-3 gap-3">
      <div>
        <label class="text-sm font-medium text-slate-700">Start Date *</label>
        <input name="start_date" type="date" value="{{ start_date }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">End Date *</label>
        <input name="end_date" type="date" value="{{ end_date }}" required class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium text-slate-700">Alert Threshold (0-1)</label>
        <input name="alert_threshold" type="number" step="0.01" min="0" max="1" value="{{ alert_threshold }}" class="mt-1 w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
      </div>
    </div>
    <div class="flex justify-end gap-2 pt-2">
      <a href="/ledgers/{{ ledger_id }}/budgets" class="rounded-lg border border-slate-300 px-3 py-2 text-sm font-medium hover:bg-slate-50">Cancel</a>
      <button class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">Create Budget</button>
    </div>
  </form>
</main>
{% endblock %}
