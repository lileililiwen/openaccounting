{% extends "base.html" %}
{% block title %}Log in — OpenAccounting{% endblock %}
{% block body %}
<main class="flex-1 flex items-center justify-center p-6">
  <div class="w-full max-w-sm">
    <div class="text-center mb-6">
      <div class="inline-block w-10 h-10 rounded-lg bg-slate-900 text-white text-sm leading-10 text-center font-bold">OA</div>
      <h1 class="mt-3 text-2xl font-semibold">OpenAccounting</h1>
      <p class="text-sm text-slate-500">Sign in to your books</p>
    </div>
    {% if !error.is_empty() %}
      <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
    {% endif %}
    <form method="post" action="/login" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
      {% if !next.is_empty() %}
        <input type="hidden" name="next" value="{{ next }}" />
      {% endif %}
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Email</span>
        <input type="email" name="email" required autofocus class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:ring-0" />
      </label>
      <label class="block">
        <span class="text-sm font-medium text-slate-700">Password</span>
        <input type="password" name="password" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm focus:border-slate-500 focus:ring-0" />
      </label>
      <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Sign in</button>
    </form>
    <p class="mt-4 text-center text-sm text-slate-500">
      New here? <a href="/register" class="text-slate-800 underline">Create an account</a>
    </p>
  </div>
</main>
{% endblock %}
