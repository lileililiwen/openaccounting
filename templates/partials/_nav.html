{% if !username.is_empty() %}
<nav class="sticky top-0 z-20 bg-white/90 backdrop-blur border-b border-slate-200">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex items-center gap-3 h-14">
    <a href="/" class="font-semibold text-slate-800 flex items-center gap-2">
      <span class="inline-block w-6 h-6 rounded bg-slate-900 text-white text-[10px] leading-6 text-center font-bold">OA</span>
      <span class="hidden sm:inline">OpenAccounting</span>
    </a>
    <div class="hidden md:flex items-center gap-1 ml-4 text-sm">
      <a href="/ledgers" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Ledgers</a>
      {% if !ledger_name.is_empty() %}
        <a href="/ledgers/{{ ledger_id }}/dashboard" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Dashboard</a>
        <a href="/ledgers/{{ ledger_id }}/transactions" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Transactions</a>
        <a href="/ledgers/{{ ledger_id }}/accounts" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Accounts</a>
        <a href="/ledgers/{{ ledger_id }}/documents" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Documents</a>
        <a href="/ledgers/{{ ledger_id }}/reports" class="px-2 py-1 rounded text-slate-600 hover:bg-slate-100">Reports</a>
      {% endif %}
    </div>
    <div class="ml-auto flex items-center gap-2 text-sm">
      <span class="hidden sm:inline text-slate-500">@{{ username }}</span>
      <form method="post" action="/logout" class="inline">
        <button class="rounded border border-slate-300 px-2 py-1 text-slate-600 hover:bg-slate-50">Log out</button>
      </form>
    </div>
  </div>
  <!-- Mobile sub-nav -->
  {% if !ledger_name.is_empty() %}
  <div class="md:hidden border-t border-slate-200 px-2 py-1 overflow-x-auto whitespace-nowrap text-sm">
    <a href="/ledgers/{{ ledger_id }}/dashboard" class="inline-block px-2 py-1 text-slate-600">Dashboard</a>
    <a href="/ledgers/{{ ledger_id }}/transactions" class="inline-block px-2 py-1 text-slate-600">Transactions</a>
    <a href="/ledgers/{{ ledger_id }}/accounts" class="inline-block px-2 py-1 text-slate-600">Accounts</a>
    <a href="/ledgers/{{ ledger_id }}/documents" class="inline-block px-2 py-1 text-slate-600">Documents</a>
    <a href="/ledgers/{{ ledger_id }}/reports" class="inline-block px-2 py-1 text-slate-600">Reports</a>
  </div>
  {% endif %}
</nav>
{% endif %}
