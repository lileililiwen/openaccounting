{# Empty-state for budgets list. Expects `ledger_id` in the
   parent context. Renders an inline SVG illustration (no JS), a
   short message, and a primary CTA. #}
<section data-empty-state="budgets"
         class="rounded-xl bg-white border border-slate-200 p-10 flex flex-col items-center text-center space-y-4">
  <div class="w-32 h-24 text-slate-400" aria-hidden="true">
    <svg viewBox="0 0 128 96" fill="none" xmlns="http://www.w3.org/2000/svg" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16 80h96" stroke-dasharray="2 3"/>
      <rect x="24" y="48" width="14" height="32" fill="#e2e8f0"/>
      <rect x="48" y="32" width="14" height="48" fill="#cbd5e1"/>
      <rect x="72" y="56" width="14" height="24" fill="#e2e8f0"/>
      <rect x="96" y="20" width="14" height="60" fill="#cbd5e1"/>
      <path d="M28 24l4 4 8-8" stroke="#94a3b8"/>
    </svg>
  </div>
  <h2 class="text-lg font-semibold text-slate-800">No budgets yet</h2>
  <p class="text-slate-500 text-sm max-w-md">
    Set monthly targets for expense accounts so variance shows up early.
  </p>
  <a href="/ledgers/{{ ledger_id }}/budgets/new"
     class="rounded-lg bg-slate-900 text-white px-4 py-2 text-sm font-medium hover:bg-slate-800">
    Create your first budget
  </a>
</section>
