{% extends "base.html" %}
{% block title %}New contact — {{ ledger_name }}{% endblock %}
{% block body %}
{% include "partials/_nav.html" %}
<main class="flex-1 max-w-lg w-full mx-auto px-4 sm:px-6 lg:px-8 py-6">
  <h1 class="text-2xl font-semibold mb-4">New contact</h1>
  <p class="text-sm text-slate-500 mb-4">In <strong>{{ ledger_name }}</strong></p>
  {% if !error.is_empty() %}
    <div class="mb-3 rounded-lg border border-rose-200 bg-rose-50 text-rose-800 text-sm px-3 py-2">{{ error }}</div>
  {% endif %}
  <form method="post" action="/ledgers/{{ ledger_id }}/contacts/new" class="space-y-3 bg-white p-5 rounded-xl border border-slate-200">
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Name</span>
      <input name="name" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Kind</span>
      <select name="kind" required class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm">
        <option value="customer">Customer</option>
        <option value="vendor">Vendor</option>
        <option value="both">Both</option>
      </select>
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Email (optional)</span>
      <input name="email" type="email" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <label class="block">
      <span class="text-sm font-medium text-slate-700">Phone (optional)</span>
      <input name="phone" type="tel" class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-sm" />
    </label>
    <button class="w-full rounded-lg bg-slate-900 text-white px-3 py-2 text-sm font-medium hover:bg-slate-800">Create contact</button>
  </form>
</main>
{% endblock %}
